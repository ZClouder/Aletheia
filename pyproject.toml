[project]
name = "aletheia"
version = "0.1.0"
description = "AI application evaluation and optimization loop — Python implementation"
requires-python = ">=3.11"
dependencies = ["openai>=1.99", "pydantic>=2.11", "pyyaml>=6.0", "rich>=14.0"]
[dependency-groups]
dev = ["pyright>=1.1.403", "pytest>=8.4", "pytest-asyncio>=1.1", "ruff>=0.12"]
[project.scripts]
aletheia = "aletheia.cli:main"
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aletheia"]
